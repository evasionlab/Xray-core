name: Build Xray Core Private Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish"
        required: true
      latest:
        description: "Also publish latest"
        type: boolean
        default: false
  push:
    branches:
      - main
      - "codex/**"

env:
  REGISTRY_HOST: registry.team.evasionlab.ru
  IMAGE_NAME: xray-core

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute tags
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            image_tag="${{ github.event.inputs.tag }}"
            publish_latest="${{ github.event.inputs.latest }}"
          else
            image_tag="${GITHUB_REF_NAME//\//-}"
            publish_latest="false"
          fi

          {
            echo "tags<<EOF"
            echo "${REGISTRY_HOST}/vpn/${IMAGE_NAME}:${image_tag}"
            echo "${REGISTRY_HOST}/vpn/${IMAGE_NAME}:${GITHUB_SHA}"
            if [[ "${publish_latest}" == "true" ]]; then
              echo "${REGISTRY_HOST}/vpn/${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure tailnet registry hostname resolves
        run: |
          timeout 30 bash -lc 'until getent hosts "${REGISTRY_HOST}"; do sleep 2; done'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.ELAB_DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.ELAB_DOCKER_REGISTRY_PASSWORD }}

      - name: Build and push linux/amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/docker/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
