name: Build and Push Docker Image

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag:"
        required: true
      latest:
        description: "Set to latest"
        type: boolean
        default: false

concurrency:
  group: xray-private-image-publisher
  cancel-in-progress: false
  queue: max

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  build-and-push:
    if: github.repository == 'evasionlab/Xray-core' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'release' && github.event.action == 'published'))
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read

    steps:
      - name: Resolve private image tag
        shell: bash
        env:
          SOURCE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          REQUEST_LATEST: ${{ inputs.latest }}
        run: |
          set -euo pipefail
          image_tag="$SOURCE_TAG"
          if [[ "$image_tag" =~ ^v[0-9]+\.[0-9] ]]; then
            image_tag="${image_tag#v}"
          fi
          [[ "$image_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo 'Invalid image tag'; exit 1; }
          echo "FULL_IMAGE_NAME=registry.team.evasionlab.ru/vpn/xray-core-fork" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$image_tag" >> "$GITHUB_ENV"
          latest=false
          newest=false
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            newest=true
            [[ "$PRERELEASE" == false ]] && latest=true
          elif [[ "$REQUEST_LATEST" == true ]]; then
            latest=true
          fi
          echo "LATEST=$latest" >> "$GITHUB_ENV"
          echo "NEWEST=$newest" >> "$GITHUB_ENV"

      - name: Checkout exact release source or trusted main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          persist-credentials: false

      - name: Require migrated private Docker definitions
        shell: bash
        run: |
          python3 - <<'PYBASES'
          import pathlib, re, shlex
          for name in ('.github/docker/Dockerfile', '.github/docker/Dockerfile.usa'):
              text = pathlib.Path(name).read_text()
              for line in text.splitlines():
                  if re.match(r'^\s*#\s*syntax\s*=', line, re.IGNORECASE):
                      raise SystemExit(f'{name}: external Dockerfile frontend is not allowed; use a source revision containing the private publisher migration')
                  if not re.match(r'^\s*FROM(?:\s|$)', line, re.IGNORECASE):
                      continue
                  fields = shlex.split(line)
                  image = fields[2] if fields[1].startswith('--platform=') else fields[1]
                  if not re.fullmatch(r'registry\.team\.evasionlab\.ru/[a-z0-9/_.:-]+@sha256:[a-f0-9]{64}', image):
                      raise SystemExit(f'{name}: immutable private base required; use a source revision containing the private publisher migration')
          print('Source revision contains immutable private Docker definitions')
          PYBASES

      - name: Resolve configured private registry endpoint
        shell: bash
        env:
          REGISTRY_PRIVATE_IP: ${{ vars.REGISTRY_PRIVATE_IP || '100.75.208.107' }}
        run: |
          set -euo pipefail
          python3 - <<'PYHOSTS'
          import ipaddress, os, subprocess
          host = 'registry.team.evasionlab.ru'
          address = str(ipaddress.ip_address(os.environ['REGISTRY_PRIVATE_IP']))
          script = r"""import pathlib,sys
          path=pathlib.Path('/etc/hosts')
          host,address=sys.argv[1:]
          lines=[]
          for line in path.read_text().splitlines():
              body,mark,comment=line.partition('#')
              fields=body.split()
              if len(fields)>1 and host in fields[1:]:
                  fields=[fields[0]]+[x for x in fields[1:] if x!=host]
                  if len(fields)>1: lines.append(' '.join(fields)+((' #'+comment) if mark else ''))
                  elif mark: lines.append('#'+comment)
              else: lines.append(line)
          lines.append(f'{address} {host}')
          path.write_text('\n'.join(lines)+'\n')
          """
          subprocess.run(['sudo','python3','-c',script,host,address],check=True)
          PYHOSTS
          curl --fail --silent --show-error --noproxy '*' https://registry.team.evasionlab.ru/v2/ >/dev/null

      - name: Use the existing containerd-backed Docker builder
        shell: bash
        run: |
          set -euo pipefail
          docker info --format '{{json .DriverStatus}}' | python3 -c 'import json,sys; assert ["driver-type", "io.containerd.snapshotter.v1"] in json.load(sys.stdin), "Existing Docker containerd image store is required"'
          docker buildx inspect default --bootstrap

      - name: Build Docker image (main architectures)
        id: build_main_arches
        uses: docker/build-push-action@v7
        with:
          builder: default
          context: .
          file: .github/docker/Dockerfile
          platforms: |
            linux/amd64
            linux/arm/v7
            linux/arm64/v8
            linux/ppc64le
            linux/s390x
          provenance: false
          push: true
          tags: ${{ env.FULL_IMAGE_NAME }}:build-main

      - name: Build Docker image (additional architectures)
        id: build_additional_arches
        uses: docker/build-push-action@v7
        with:
          builder: default
          context: .
          file: .github/docker/Dockerfile.usa
          platforms: |
            linux/386
            linux/arm/v6
            linux/riscv64
            linux/loong64
          provenance: false
          push: true
          tags: ${{ env.FULL_IMAGE_NAME }}:build-additional

      - name: Create manifest list and push
        run: |
          echo "Creating multi-arch manifest with tag: '${{ env.FULL_IMAGE_NAME }}:${{ env.IMAGE_TAG }}'."
          docker buildx imagetools create \
            --tag ${{ env.FULL_IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            ${{ env.FULL_IMAGE_NAME }}@${{ steps.build_main_arches.outputs.digest }} \
            ${{ env.FULL_IMAGE_NAME }}@${{ steps.build_additional_arches.outputs.digest }}

          if [[ "${{ env.LATEST }}" == "true" ]]; then
            echo "Adding 'latest' tag to manifest: '${{ env.FULL_IMAGE_NAME }}:latest'."
            docker buildx imagetools create \
            --tag ${{ env.FULL_IMAGE_NAME }}:latest \
            ${{ env.FULL_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          fi

          if [[ "${{ env.NEWEST }}" == "true" ]]; then
            echo "Adding 'pre-release' tag to manifest: '${{ env.FULL_IMAGE_NAME }}:pre-release'."
            docker buildx imagetools create \
            --tag ${{ env.FULL_IMAGE_NAME }}:pre-release \
            ${{ env.FULL_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          fi

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.FULL_IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          if [[ "${{ env.LATEST }}" == "true" ]]; then
            docker buildx imagetools inspect ${{ env.FULL_IMAGE_NAME }}:latest
          fi

          if [[ "${{ env.NEWEST }}" == "true" ]]; then
            docker buildx imagetools inspect ${{ env.FULL_IMAGE_NAME }}:pre-release
          fi
